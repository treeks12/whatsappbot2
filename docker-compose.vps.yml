services:
  evolution-db:
    image: postgres:16-alpine
    container_name: evolution-db
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - POSTGRES_DB=evolution
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=evolution_local
    volumes:
      - evolution_db:/var/lib/postgresql/data
    networks:
      - bot-net

  evolution-api:
    # Imagem derivada da 2.4.0-rc2 com patch de pairingCode estavel
    # (senao cada ciclo de QR mata o codigo pendente -> "codigo incorreto").
    build:
      context: ./evolution-patch
    image: whatsappbot2-evolution-api:2.4.0-rc2-pairing
    container_name: evolution-api
    ports:
      # 8082 no host: o 8080 ja e usado por outro servico nesta VPS.
      # O bot acessa a Evolution pela rede interna (evolution-api:8080),
      # entao esta porta so serve para debug manual.
      - "127.0.0.1:8082:8080"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - evolution-db
      - evolution-redis
    environment:
      - SERVER_TYPE=http
      - SERVER_PORT=8080
      - SERVER_URL=http://localhost:8080
      - CORS_ORIGIN=*
      - CORS_METHODS=POST,GET,PUT,DELETE
      - CORS_CREDENTIALS=true
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - GLOBAL_API_KEY=${EVOLUTION_API_KEY}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - LANGUAGE=pt-BR
      - STORE_MESSAGES=false
      - STORE_CONTACTS=false
      - STORE_CHATS=false
      - CONFIG_SESSION_PHONE_CLIENT=Evolution API VPS
      - CONFIG_SESSION_PHONE_NAME=Chrome
      - QRCODE_LIMIT=30
      - LOG_LEVEL=INFO
      - LOG_COLOR=true
      - LOG_BAILEYS=info
      - STORAGE_PROVIDER=local
      - STORAGE_LOCAL_PATH=/evolution/store
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:evolution_local@evolution-db:5432/evolution
      - DATABASE_CONNECTION_DATABASE_NAME=evolution
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_v24
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=false
      - DATABASE_SAVE_MESSAGE_UPDATE=false
      - DATABASE_SAVE_DATA_CONTACTS=false
      - DATABASE_SAVE_DATA_CHATS=false
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://evolution-redis:6379/1
      - CACHE_REDIS_PREFIX_KEY=evolution24
      - CACHE_REDIS_SAVE_INSTANCES=false
      - CACHE_LOCAL_ENABLED=false
    volumes:
      - evolution_store:/evolution/store
      - evolution_instances:/evolution/instances
    networks:
      - bot-net

  evolution-redis:
    image: redis:7-alpine
    container_name: evolution-redis
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - evolution_redis:/data
    networks:
      - bot-net

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whatsapp-bot-v2
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ADMIN_IDS=${TELEGRAM_ADMIN_IDS:-}
      - EVOLUTION_API_URL=http://evolution-api:8080
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - DATABASE_PATH=/app/data/bot.sqlite3
      - CAMPAIGNS_DIR=/app/campaigns
      - MAX_CLIENTS_PER_CAMPAIGN=${MAX_CLIENTS_PER_CAMPAIGN:-0}
      - MAX_TRUSTED_CLIENTS_PER_CAMPAIGN=${MAX_TRUSTED_CLIENTS_PER_CAMPAIGN:-0}
      - MAX_PRECAUTION_CLIENTS_PER_CAMPAIGN=${MAX_PRECAUTION_CLIENTS_PER_CAMPAIGN:-0}
      - MAX_MEDIA_PER_CAMPAIGN=${MAX_MEDIA_PER_CAMPAIGN:-5}
      - MAX_MEDIA_FILE_MB=${MAX_MEDIA_FILE_MB:-3}
      - MAX_PARALLEL_MEDIA_UPLOADS=${MAX_PARALLEL_MEDIA_UPLOADS:-2}
      - PROGRESS_UPDATE_INTERVAL_SECONDS=${PROGRESS_UPDATE_INTERVAL_SECONDS:-5}
      - CLEANUP_CAMPAIGN_FILES_ON_FINISH=${CLEANUP_CAMPAIGN_FILES_ON_FINISH:-true}
      - DEFAULT_PROFILE=${DEFAULT_PROFILE:-precaucao_100}
      - SEND_WINDOW=${SEND_WINDOW:-}
      - SEND_WINDOW_TZ=${SEND_WINDOW_TZ:-}
      - MIN_FREE_MEMORY_MB=${MIN_FREE_MEMORY_MB:-256}
      - EVOLUTION_DOCKER_CONTROL=true
      - EVOLUTION_DOCKER_CONTAINER=evolution-api
      - DOCKER_SOCKET_PATH=/var/run/docker.sock
      - EVOLUTION_IDLE_STOP_SECONDS=${EVOLUTION_IDLE_STOP_SECONDS:-600}
      - CONTACT_LIST_SNAPSHOT_KEEP=${CONTACT_LIST_SNAPSHOT_KEEP:-3}
      - CONTACT_LIST_SNAPSHOT_DAYS=${CONTACT_LIST_SNAPSHOT_DAYS:-14}
      - WEBHOOK_LISTEN_HOST=${WEBHOOK_LISTEN_HOST:-0.0.0.0}
      - WEBHOOK_LISTEN_PORT=${WEBHOOK_LISTEN_PORT:-8090}
      - WEBHOOK_TOKEN=${WEBHOOK_TOKEN:-}
      - WEBHOOK_PUBLIC_URL=${WEBHOOK_PUBLIC_URL:-}
      - WEBHOOK_AUTO_CONFIGURE=${WEBHOOK_AUTO_CONFIGURE:-true}
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_VARIANTS=${LLM_VARIANTS:-8}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./campaigns:/app/campaigns
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - evolution-api
    networks:
      - bot-net

volumes:
  evolution_store:
  evolution_instances:
  evolution_db:
  evolution_redis:

networks:
  bot-net:
    driver: bridge
